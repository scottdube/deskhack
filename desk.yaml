substitutions:
  device_name: desk
  friendly_name: Standing Desk

# ErgoSwiss hydraulic standing desk on a LOGICDATA COMPACT-e-3-VAL-ES-US
# control box ("Compact-3-eco", software V290). Full reverse-engineering
# writeup: https://github.com/scottdube/deskhack
#
# ============================ ARCHITECTURE (settled 2026-08-11) ==============
# Tap on the 7-pin DIN handset cable, inline between box and the original
# up/down panel (panel keeps working in parallel). Wire colours are the cut
# extension cable's, verified by measurement — NOT the DIN pin numbers.
#
#   brown  GND     red +5V     white UP     yellow DOWN     black data-out
#   green/blue = HS3/HS4, unused by the dumb panel (memory-handset lines)
#
# BUTTON LINES ARE ACTIVE-HIGH and high-impedance: a press connects the line
# to +5V (an ohmmeter's source current was enough to command motion). Drive:
#   GPIO -> 330R -> PC817 LED; opto output ties line to +5V like a finger.
#   100k bleed emitter->GND so leakage can't float an input high.
#   Optos release dark => unpowered/booting ESP32 cannot move the desk.
#
# HEIGHT: the box broadcasts on black at 1000 baud 9N1 (9-bit multi-drop),
# one packet per INCH of displayed change plus a handshake burst on any
# button press. A plain 8N1 UART recovers the payload; on real ESP32
# silicon (which KEEPS framing-error bytes) each packet arrives as
# 00 7F <payload>: skip 0x00, sync on 0x7F, then inches = (245 - b) / 2.
# Real heights are always ODD bytes; handshake words are even, gated, or
# (0xBF only) rejected by a 600ms timing guard. Details in the RX lambda.
# Verified against tape at 4 points across full travel, all within 0.5 cm.
# Overnight drift test 2026-08-12: none (77 cm -> 77 cm under load).
#
# CHANNELS (30-pin DevKit V1):
#   D25 GPIO25 -> opto U1 -> white  (UP)
#   D26 GPIO26 -> opto U2 -> yellow (DOWN)
#   RX2 GPIO16 <- 22k / (22k+22k) divider <- black (5V bus, 3.3V pin)
#
# DUTY CYCLE: the box is rated 2 min on / 18 min off and the watchdog below
# enforces it. Do not remove it, do not build nudge-every-N-minutes
# automations on top of this device.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: all_stop

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi: !include wifi.yaml

uart:
  id: deskbus
  rx_pin: GPIO16
  baud_rate: 1000
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Commissioning aid: dump raw RX bytes to the log. Height packets appear
  # as 00 7F <byte> groups. Remove once the bus is proven.
  debug:
    direction: RX
    after:
      timeout: 100ms

globals:
  - id: cur_in            # last reported height, inches
    type: float
    # Deliberately NOT restored across reboots: the desk can move (panel
    # presses) while the ESP32 is off, and a stale restored height creates a
    # dead zone where seeks inside the error do nothing. Observed as "target
    # must be 4in away to work" on 2026-08-12. Every boot re-learns instead.
    restore_value: no
    initial_value: '30'
  - id: height_known      # false until the box has told us something
    type: bool
    initial_value: 'false'
  - id: expect_height     # next byte after 0xFE is the payload
    type: bool
    initial_value: 'false'
  - id: run_s             # seconds of motion in the current duty window
    type: float
    initial_value: '0'
  - id: locked_out
    type: bool
    initial_value: 'false'
  - id: last_seen_in      # for stall detection
    type: float
    initial_value: '0'
  - id: stall_s
    type: float
    initial_value: '0'

switch:
  # Closing either opto ties its line to +5V, exactly what the panel button
  # does. The panel keeps working in parallel.
  - platform: gpio
    id: press_up
    name: "Press Up"
    icon: mdi:arrow-up-bold
    pin: GPIO25
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: press_dn
    name: "Press Down"
    icon: mdi:arrow-down-bold
    pin: GPIO26
    restore_mode: ALWAYS_OFF

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 30s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: template
    name: "Height"
    id: height
    unit_of_measurement: in
    accuracy_decimals: 1
    icon: mdi:arrow-expand-vertical

  # Duty-cycle visibility. The box is rated 2 min on / 18 min off; run_s
  # accumulates while driving and decays at 0.1 s/s while idle, so a full
  # budget takes ~16.7 min to restore. Lockout clears only at run_s <= 0.
  - platform: template
    name: "Drive Budget"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:timer-sand
    update_interval: 5s
    lambda: return fmaxf(0.0f, 100.0f - id(run_s));

  - platform: template
    name: "Budget Recovery"
    unit_of_measurement: min
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: mdi:timer-refresh-outline
    update_interval: 5s
    # run_s decays 0.1 per second of idle time
    lambda: return id(run_s) / 0.1f / 60.0f;

binary_sensor:
  - platform: template
    name: "Height Known"
    lambda: return id(height_known);
  - platform: template
    name: "Duty Lockout"
    lambda: return id(locked_out);

number:
  - platform: template
    name: "Target Height"
    id: target_in
    unit_of_measurement: in
    min_value: 27
    max_value: 38
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 30
    set_action:
      then:
        # A template number fires set_action BEFORE publishing the new state,
        # so id(target_in).state still holds the OLD value in here. Publish
        # first, then seek, or every move chases the previous command
        # (observed 2026-08-12: "33 -> 38 does nothing, another nudge works").
        - lambda: id(target_in).publish_state(x);
        - script.execute: seek

# Present the bench as a cover so voice assistants can drive it with the
# built-in HassSetPosition / open / close / stop intents, no custom sentences
# needed ("set the standing bench to 80 percent"). Position 0% = 27.0 in
# (bottom of travel), 100% = 38.0 in (top). This is purely an alternative
# face on the same seek loop -- Height, Target Height, Sit and Stand are
# unaffected and keep working exactly as before.
cover:
  - platform: template
    name: "Bench"
    id: bench_cover
    device_class: shade
    has_position: true
    lambda: |-
      float p = (id(cur_in) - 27.0f) / 11.0f;
      return p < 0.0f ? 0.0f : (p > 1.0f ? 1.0f : p);
    position_action:
      - lambda: |-
          // Snap to whole inches: the box only ever reports whole inches, so
          // a finer target could never be satisfied and would drive forever.
          float t = roundf(27.0f + pos * 11.0f);
          if (t < 27.0f) t = 27.0f;
          if (t > 38.0f) t = 38.0f;
          id(target_in).publish_state(t);
      - script.execute: seek
    open_action:
      - lambda: id(target_in).publish_state(38.0f);
      - script.execute: seek
    close_action:
      - lambda: id(target_in).publish_state(27.0f);
      - script.execute: seek
    stop_action:
      - script.stop: seek
      - script.execute: all_stop

interval:
  # Drain the bus. At 1000 baud a 50ms tick cannot overrun the 64-byte buffer.
  - interval: 50ms
    then:
      - lambda: |-
          // Observed on real silicon (2026-08-12): the ESP32 UART KEEPS
          // framing-error bytes rather than discarding them, so the 9-bit
          // packet arrives as [00 artifact] 7F <payload> instead of the
          // FE <payload> a discard-and-resync UART would produce.
          //   - 0x00       framing-error artifact, one per packet: skip
          //   - 0x7F       packet header: next byte is the payload
          //   - heights    always ODD (b = 245 - 2*inches), 0xA9..0xBF
          //   - handshake  constants D7/01/04/BC/...: all even or gated,
          //                EXCEPT 0xBF which aliases a true 27.0in reading.
          //                It always arrives within ~400ms of the other
          //                handshake words, so a timing guard kills it.
          static uint32_t last_hs_ms = 0;
          uint8_t b;
          while (id(deskbus).available()) {
            if (!id(deskbus).read_byte(&b)) break;
            if (b == 0x00) continue;
            if (b == 0x7F) { id(expect_height) = true; continue; }
            if (!id(expect_height)) continue;
            id(expect_height) = false;
            float in = (245.0f - (float) b) / 2.0f;
            bool odd = (b & 1) != 0;
            bool in_range = in >= 26.0f && in <= 39.0f;
            if (!odd || !in_range) { last_hs_ms = millis(); continue; }
            if (b == 0xD7) { last_hs_ms = millis(); continue; }   // 15in: handshake
            if (b == 0xBF && (millis() - last_hs_ms) < 600) continue;
            id(cur_in) = in;
            id(height_known) = true;
            id(height).publish_state(in);
          }

  # Duty-cycle and stall watchdog. Box rating: 2 min on / 18 min off.
  - interval: 500ms
    then:
      - lambda: |-
          bool driving = id(press_up).state || id(press_dn).state;
          if (driving) {
            id(run_s) += 0.5f;
            if (fabsf(id(cur_in) - id(last_seen_in)) < 0.01f) {
              id(stall_s) += 0.5f;
            } else {
              id(stall_s) = 0.0f;
              id(last_seen_in) = id(cur_in);
            }
            // Height only updates once per inch (~1.7s of travel), so the
            // stall threshold must be generous or normal moves would trip it.
            if (id(stall_s) > 12.0f) {
              ESP_LOGW("desk", "no movement reported, stopping");
              id(all_stop).execute();
            }
            if (id(run_s) > 100.0f) {
              ESP_LOGW("desk", "duty limit reached, locking out");
              id(locked_out) = true;
              id(all_stop).execute();
            }
          } else {
            id(run_s) = fmaxf(0.0f, id(run_s) - 0.05f);   // ~18 min recovery
            id(stall_s) = 0.0f;
            if (id(run_s) <= 0.0f) id(locked_out) = false;
          }

script:
  - id: all_stop
    then:
      - switch.turn_off: press_up
      - switch.turn_off: press_dn

  # The box only reports on change, so after a reboot height is unknown until
  # something presses a button. Luckily the handshake burst the box emits on
  # ANY press carries the current height in its 4th packet (~300ms in), so a
  # blip far too short to move the desk a visible amount is enough to learn
  # where it is.
  - id: learn_height
    then:
      - if:
          condition:
            lambda: return !id(height_known);
          then:
            - switch.turn_on: press_up
            - delay: 600ms
            - switch.turn_off: press_up
            - delay: 500ms

  - id: seek
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("desk", "seek: target %.0f, current %.0f, known %d, lockout %d",
                   id(target_in).state, id(cur_in), id(height_known),
                   id(locked_out));
      - if:
          condition:
            lambda: return id(locked_out);
          then:
            - logger.log: "duty-cycle lockout, ignoring move"
          else:
            - script.execute: learn_height
            - wait_until:
                condition:
                  lambda: return id(height_known);
                timeout: 10s
            # Bang-bang on the reported inch. Feedback is 1-inch granular;
            # stop as soon as the target value is reported.
            - while:
                condition:
                  lambda: |-
                    return id(height_known) && !id(locked_out) &&
                           fabsf(id(target_in).state - id(cur_in)) >= 1.0f;
                then:
                  - lambda: |-
                      if (id(target_in).state > id(cur_in)) id(press_up).turn_on();
                      else id(press_dn).turn_on();
                  - delay: 100ms
            - script.execute: all_stop

button:
  # Home Assistant sends nothing when a slider is dragged to the value it
  # already holds, so Target Height alone cannot re-trigger a move (observed
  # 2026-08-12: "won't move until I change the command by an inch"). This
  # button runs the seek unconditionally against whatever the target says.
  - platform: template
    name: "Go To Target"
    icon: mdi:play-circle-outline
    on_press: [script.execute: seek]

  - platform: template
    name: "Sit"
    icon: mdi:chair-rolling
    on_press: [number.set: {id: target_in, value: 29}]
  - platform: template
    name: "Stand"
    icon: mdi:human-handsup
    # 38.0 in is the measured top of travel; the box stops itself there.
    on_press: [number.set: {id: target_in, value: 38}]
  - platform: template
    name: "Stop"
    icon: mdi:stop-circle-outline
    on_press:
      - script.stop: seek
      - script.execute: all_stop
  - platform: restart
    name: "Restart"
